<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MSC: The E7 Platform Opportunity</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',system-ui,sans-serif;background:#f6f9fc;color:#0a1f33;line-height:1.7}
:root{
  --msc-primary:#003a70;--msc-dark:#002347;--msc-navy:#001730;--msc-accent:#0084c9;--msc-gold:#c5a24a;
  --msc-light:#e4eef6;--msc-success:#2d8a4e;--msc-warn:#e07e22;--msc-red:#c0392b;
  --msc-surface:#ffffff;--msc-text:#0a1f33;--msc-muted:#54657a;--msc-border:#d9e2ec;
  --radius:12px;--shadow:0 2px 12px rgba(0,30,70,.06);--shadow-lg:0 8px 32px rgba(0,30,70,.12);
}
.top-nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,35,71,.97);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);padding:0 40px;height:60px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:#fff;letter-spacing:1px}
.nav-links{display:flex;gap:26px;align-items:center}
.nav-links a{color:rgba(255,255,255,.75);text-decoration:none;font-size:13px;font-weight:500;transition:color .2s}
.nav-links a:hover{color:#fff}
.nav-badge{background:var(--msc-gold);color:var(--msc-navy);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.5px}
.section{max-width:1200px;margin:0 auto;padding:56px 40px}
.section-label{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--msc-accent);margin-bottom:12px}
.section h2{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;color:var(--msc-navy);letter-spacing:-.5px}
.section h2 .highlight{color:var(--msc-accent)}
.section-intro{font-size:16px;color:var(--msc-muted);max-width:72ch;margin-top:12px}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}
.reveal.visible{opacity:1;transform:none}

/* exec summary */
.exec-summary-section{padding-top:96px}
.exec-headline-card{background:linear-gradient(135deg,var(--msc-navy),var(--msc-primary));color:#fff;border-radius:18px;padding:40px 44px;box-shadow:var(--shadow-lg)}
.exec-kicker{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--msc-gold);margin-bottom:14px}
.exec-headline{font-family:'Space Grotesk',sans-serif;font-size:36px;line-height:1.2;font-weight:700;letter-spacing:-.5px;max-width:22ch;margin-bottom:20px;color:#fff}
.exec-headline-card .exec-headline{color:#fff !important}
.exec-decision{background:rgba(255,255,255,.12);border-left:4px solid var(--msc-gold);border-radius:8px;padding:14px 18px;font-size:16px}
.exec-decision strong{color:var(--msc-gold)}
.exec-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:28px}
.exec-cell{background:var(--msc-surface);border:1px solid var(--msc-border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.exec-cell h4{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--msc-accent);margin-bottom:12px;font-weight:700}
.exec-cell p{font-size:15px}
.exec-risk-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.exec-risk-list li{padding-left:22px;position:relative;font-size:14px}
.exec-risk-list li::before{content:'\25B2';color:var(--msc-red);position:absolute;left:0;top:2px;font-size:10px}
.exec-mile{display:flex;gap:14px;padding:9px 0;border-bottom:1px dashed var(--msc-border);font-size:14px}
.exec-mile:last-child{border-bottom:none}
.exec-mile-date{font-weight:700;color:var(--msc-accent);min-width:64px}

/* execution */
.execution-section{background:linear-gradient(180deg,#eef4fa,#fff)}
.exec-target-banner{display:flex;align-items:center;gap:16px;background:var(--msc-light);border:1px solid rgba(0,132,201,.2);border-radius:12px;padding:16px 24px;margin:24px 0 28px;flex-wrap:wrap}
.etb-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;color:var(--msc-muted)}
.etb-main{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;color:var(--msc-navy)}
.etb-date{margin-left:auto;font-weight:700;font-size:19px;color:var(--msc-red)}
.execution-cols{display:grid;grid-template-columns:1.1fr .9fr;gap:24px}
.exec-col{background:var(--msc-surface);border:1px solid var(--msc-border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
.exec-col-head{font-size:15px;font-weight:700;color:var(--msc-navy);margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.exec-auto{font-size:11px;font-weight:500;color:var(--msc-success);background:rgba(45,138,78,.1);padding:3px 9px;border-radius:10px}
.exec-task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--msc-border)}
.exec-task:last-child{border-bottom:none}
.exec-box{color:var(--msc-muted);font-size:17px;flex-shrink:0}
.exec-check{color:var(--msc-success);font-size:16px;font-weight:800;flex-shrink:0}
.exec-task-text{font-size:14.5px;line-height:1.5}
.exec-task-meta{font-size:12.5px;color:var(--msc-muted);margin-top:3px}
.exec-task-done .exec-task-text{text-decoration:line-through;color:var(--msc-muted)}
.exec-evidence{font-size:12.5px;color:var(--msc-success);font-weight:600;margin-top:4px;display:block}

/* opportunity / economics */
.opp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:8px}
.opp-card{background:var(--msc-surface);border:1px solid var(--msc-border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.opp-card .ol{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--msc-muted);font-weight:700}
.opp-card .ov{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:var(--msc-navy);margin-top:5px}
.opp-card .os{font-size:12px;color:var(--msc-muted);margin-top:4px}
.opp-card.hero{background:linear-gradient(135deg,var(--msc-primary),var(--msc-accent));color:#fff;grid-column:span 2}
.opp-card.hero .ol{color:rgba(255,255,255,.75)}.opp-card.hero .ov{color:#fff;font-size:34px}.opp-card.hero .os{color:rgba(255,255,255,.8)}

/* strategy */
.strat-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
.strat-card{background:var(--msc-surface);border:1px solid var(--msc-border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.strat-card.full{grid-column:1 / -1}
.strat-card h4{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--msc-accent);margin-bottom:12px;font-weight:700}
.strat-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.strat-list li{padding:9px 0;border-bottom:1px dashed var(--msc-border);font-size:14.5px}
.strat-list li:last-child{border-bottom:none}
.strat-card.full p{font-size:15px;line-height:1.6}
.talk-row{padding:10px 14px;margin:8px 0;background:var(--msc-light);border-radius:8px;font-size:15px;font-style:italic}

/* stakeholders */
.stakeholder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:8px}
.stakeholder-card{background:var(--msc-surface);border:1px solid var(--msc-border);border-left:4px solid var(--msc-muted);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-name{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;color:var(--msc-navy)}
.sh-chip{font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;padding:3px 10px;border-radius:10px;white-space:nowrap;background:#eef1f6;color:var(--msc-muted)}
.sh-role{font-size:12.5px;color:var(--msc-muted);font-weight:600;margin:6px 0 10px}
.sh-cares{font-size:14px;margin-bottom:10px}
.sh-note{font-size:12.5px;color:var(--msc-accent);font-weight:600}
.sh-champion{border-left-color:var(--msc-success)}.sh-champion .sh-chip{background:rgba(45,138,78,.14);color:var(--msc-success)}
.sh-exec{border-left-color:var(--msc-gold)}.sh-exec .sh-chip{background:rgba(197,162,74,.18);color:#8a6d1f}
.sh-engaged{border-left-color:var(--msc-accent)}.sh-engaged .sh-chip{background:rgba(0,132,201,.12);color:var(--msc-accent)}
.sh-not-won{border-left-color:var(--msc-warn)}.sh-not-won .sh-chip{background:rgba(224,126,34,.14);color:var(--msc-warn)}

.foot{max-width:1200px;margin:0 auto;padding:0 40px 60px;color:var(--msc-muted);font-size:12.5px}
@media(max-width:820px){.exec-grid,.execution-cols,.strat-grid{grid-template-columns:1fr}.opp-grid{grid-template-columns:1fr 1fr}.opp-card.hero{grid-column:span 2}.exec-headline{font-size:26px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
function useReveal(){const ref=useRef(null);useEffect(()=>{const el=ref.current;if(!el)return;const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){el.classList.add('visible');o.unobserve(el);}},{threshold:.12});o.observe(el);return()=>o.disconnect();},[]);return ref;}
function Reveal({children,className=''}){const r=useReveal();return <div ref={r} className={`reveal ${className}`}>{children}</div>;}

const execSummary = {
  headline: 'Position E7 as MSC\u2019s strategic AI standard: the fixed-cost economic foundation for 71,000 users, governed by Agent 365 and FinOps, entering budget planning as the preferred path for workforce AI and agent scale.',
  decision: 'Fabio Catassi and MSC Cargo leadership must decide to set the E7 economic foundation now at $13/user, adopting it into budget planning as the standard for workforce AI, governance, and agent scale, with activation phased at MSC\u2019s pace.',
  current: 'MSC is already scaling AI: SOFIA in production (3,000, architected to 30,000), ~9,100 Copilot licenses, and ~8,000 agents in tenant. MSC\u2019s own billed-vs-non-billed data shows 96.2% of Copilot Studio agent consumption already rides licenses they own. The named priority is predictable cost and a governed estate. The question is no longer whether to scale AI, it is how to pay, govern, and adopt it.',
  objective: 'Lock E7 as the fixed-cost standard across the 71,000-user fleet (~$11.08M/yr at $13) so everyday AI rides a predictable license while agentic consumption is governed through Agent 365 and FinOps, moving the approval conversation from run cost to business value.',
  risks: [
    'Variable economics: 8,000 agents with no pre-build cost estimate and no central spend authority. Cost is unpredictable as the estate grows.',
    'Governance: no shared registry, ownership, or lifecycle across the estate; third-party models run outside the stack.',
    'Adoption: scale depends on real, repeated use, not licenses issued. Decision must reach Fabio, not stall at champion level.',
  ],
  milestones: [
    { date: 'Summit', text: 'Align on E7 as MSC\u2019s strategic AI standard, entering budget planning as the preferred path' },
    { date: 'October', text: 'Validate consumption absorption across a full billing quarter, plus SOFIA\u2019s separate Azure runtime' },
    { date: 'FY27', text: 'Set the $13 economic foundation (2-yr term, year-2 pending deal desk); phase activation in waves' },
  ],
};

const execItems = [
  { status: 'done', text: 'Built and delivered the CFO capital-allocation narrative: pay, govern, adopt at scale', evidence: 'Sep 2026 \u00b7 MSC E7 economics deck' },
  { status: 'done', text: 'Proved the fixed-cost mechanic in MSC\u2019s own numbers: 96.2% of agent consumption absorbed by owned licenses', evidence: 'MSC billed-vs-non-billed report (Measured)' },
  { status: 'done', text: 'Validated the centralized agent-governance need (registry, identity, lifecycle, spend authority)', evidence: 'Sep 25 \u00b7 MSC E7/Agent 365 Discussion' },
  { status: 'done', text: 'Tied the motion to FinOps and cost predictability; engaged MSC in the private-preview workstream', evidence: 'Sep 28 \u00b7 Post Agent 365/E7 MSC Cargo Internal Alignment' },
  { status: 'now', text: 'Validate absorption across a full billing quarter and SOFIA\u2019s separate runtime to clear the pay-at-scale bar', owner: 'Sean Hughley', by: 'October' },
  { status: 'now', text: 'Confirm Agent 365 covers third-party-model agents and Copilot Credits governance', owner: 'Sean Hughley / Zoe Blumenthal', by: 'October' },
  { status: 'now', text: 'Agree the activation waves and success metrics; land the $1.5M+ Microsoft co-investment', owner: 'Sean Hughley', by: 'FY27' },
  { status: 'now', text: 'Secure the Summit alignment on E7 as the strategic standard, into budget planning', owner: 'Sean Hughley', by: 'Summit' },
];

const opportunity = {
  billed: 4412101, bm: 6, fyMonths: 6, seats: 62021, close: 'Jan 20, 2027',
  conf: 'Medium', dealType: 'Mid-term',
};

const strategy = {
  whyBuy: [
    'MSC is already scaling AI and named predictable cost and a governed estate as the priority. E7 answers how to pay, govern, and adopt in one standard.',
    'The fixed-cost mechanic is proven in their own numbers: at scale, covering just SOFIA\u2019s 30,000 on the full stack (~$18.36M) costs more than the entire 71,000 fleet on E7 (~$11.08M).',
    'As a global shipping operation, governed scale and auditability over 8,000 agents are operational requirements, not nice-to-haves.',
  ],
  whyNow: [
    'The estate is cheaper and simpler to standardize now than after it doubles; agents are growing faster than MSC can pay for, govern, and adopt.',
    'MSC is in the private-preview workstream and FinOps/cost predictability is live on the agenda.',
    'The Summit is the forcing function to enter E7 into budget planning as the preferred path.',
  ],
  winning: 'Lead with economics, not product. Prove the fixed-cost mechanic in MSC\u2019s own data (96.2% absorbed), frame E7 as the capital-allocation answer to pay-govern-adopt, and separate the commercial foundation from the rollout: set the $13 standard now, activate in waves with $1.5M+ Microsoft co-investment at MSC\u2019s pace. Keep the motion reaching Fabio as decision maker across all entities, use Clement and the champion bench to carry it, and anchor governance to Agent 365 + FinOps over the 8,000-agent estate. Move the approval from run cost to business value.',
  talking: [
    'Scaling AI comes down to three questions: how you pay, how you govern, how you adopt. E7 is one answer to all three.',
    'The fixed-cost mechanic is already running in your own numbers. 96.2% of agent consumption rides licenses you own today.',
    'At scale, AI becomes infrastructure. Covering just SOFIA\u2019s 30,000 on the full stack costs more than your entire 71,000 fleet on E7.',
    'Set the economics once, activate at your pace. Microsoft co-invests in the adoption that turns licenses into production. You approve on business value, not run cost.',
  ],

const stakeholders = [
  { name: 'Fabio Catassi', role: 'CIO, MSC Cargo (parent) · primary decision maker across all MSC entities', status: 'exec', cares: 'Enterprise AI strategy, governed scale, and predictable economics across every MSC entity.', note: 'The decision must reach Fabio, not stall at champion level.' },
  { name: 'Quentin', role: 'Key influencer · agent cost & economics', status: 'engaged', cares: 'Cost predictability. His primary concern is estimating how much agents will cost as the estate scales.', note: 'Sean is presenting the economic model to Quentin for feedback. Central to the pay-at-scale case.' },
  { name: 'Clement Martinez', role: 'Head of Global CIO Office', status: 'champion', cares: 'Copilot adoption and the broader AI agenda. Big Copilot champion.', note: 'Champion, not the decision maker; carries the motion internally.' },
  { name: 'MSC Security / CISO', role: 'Security · Entra, Defender, Purview', status: 'engaged', cares: 'Governance, identity, data protection across the agent estate; E5 security stack. Agent 365 as the control plane.', note: 'Name to confirm. Raised governance concerns on prior calls; MS security team (Zoe) leading Purview/Entra with their CISO.' },
  { name: 'Roberta Suda', role: 'Global AI Champion · North & Central America', status: 'champion', cares: 'AI adoption and championing use cases across the Americas.', note: 'Regional champion supporting the motion.' },
  { name: 'Gilmar Nogueira Sousa', role: 'IT Leader · Developer & EUC', status: 'champion', cares: 'Developer and end-user computing enablement.', note: 'Technical champion on the EUC side.' },
  { name: 'Renato Grecchi', role: 'IT Manager · Marketing & Dynamics Services', status: 'champion', cares: 'Dynamics and marketing services modernization.', note: 'Champion in the Dynamics workstream.' },
];

function App(){
  const done=execItems.filter(x=>x.status==='done'), now=execItems.filter(x=>x.status==='now');
  const monthly=opportunity.billed/opportunity.bm;
  const fyForecast=Math.round(monthly*opportunity.fyMonths);
  const scls={champion:'sh-champion',exec:'sh-exec',engaged:'sh-engaged','not-won':'sh-not-won'};
  const fmt=(n)=>n>=1e6?'$'+(n/1e6).toFixed(2)+'M':'$'+Math.round(n/1e3)+'K';
  return (<>
    <nav className="top-nav">
      <div className="nav-logo">MSC</div>
      <div className="nav-links">
        <a href="#exec">Executive Summary</a><a href="#execution">Execution</a>
        <a href="#opportunity">Opportunity</a><a href="#strategy">Strategy</a>
        <a href="#stakeholders">Stakeholders</a><span className="nav-badge">INTERNAL</span>

    </nav>

    <section className="section exec-summary-section" id="exec">
      <Reveal>
        <div className="exec-headline-card">
          <div className="exec-kicker">Executive Summary · Bottom Line</div>
          <h2 className="exec-headline">{execSummary.headline}</h2>
          <div className="exec-decision"><strong>Decision we need:</strong> {execSummary.decision}</div>
        </div>
      </Reveal>
      <div className="exec-grid">
        <Reveal><div className="exec-cell"><h4>Where we are</h4><p>{execSummary.current}</p></div></Reveal>
        <Reveal><div className="exec-cell"><h4>What we're after</h4><p>{execSummary.objective}</p></div></Reveal>
        <Reveal><div className="exec-cell"><h4>Risks</h4><ul className="exec-risk-list">{execSummary.risks.map((r,i)=><li key={i}>{r}</li>)}</ul></div></Reveal>
        <Reveal><div className="exec-cell"><h4>Next milestones</h4>{execSummary.milestones.map((m,i)=><div className="exec-mile" key={i}><span className="exec-mile-date">{m.date}</span><span>{m.text}</span></div>)}</div></Reveal>
      </div>
    </section>

    <section className="section execution-section" id="execution">
      <Reveal>
        <div className="section-label">Execution Strategy</div>
        <h2>What Has to <span className="highlight">Happen Now</span></h2>
        <p className="section-intro">What we have done, and what must happen to convert MSC into a committed E7 platform. Completed steps are detected from meeting transcripts and crossed out with the evidence that closed them.</p>
      </Reveal>
      <Reveal>
        <div className="exec-target-banner">
          <span className="etb-label">Target</span><span className="etb-main">Committed E7 platform · governed agents at scale</span><span className="etb-date">FY27</span>
        </div>
      </Reveal>
      <div className="execution-cols">
        <Reveal className="exec-col">
          <h3 className="exec-col-head">What has to happen now</h3>
          {now.map((x,i)=>(<div className="exec-task" key={i}><span className="exec-box">&#9633;</span><div><div className="exec-task-text">{x.text}</div><div className="exec-task-meta">{x.owner}{x.by?` · by ${x.by}`:''}</div></div></div>))}
        </Reveal>
        <Reveal className="exec-col">
          <h3 className="exec-col-head">Already done <span className="exec-auto">auto-detected from transcripts</span></h3>
          {done.map((x,i)=>(<div className="exec-task exec-task-done" key={i}><span className="exec-check">&#10003;</span><div><div className="exec-task-text">{x.text}</div>{x.evidence&&<span className="exec-evidence">&#10022; {x.evidence}</span>}</div></div>))}
        </Reveal>
      </div>
    </section>

    <section className="section" id="opportunity">
      <Reveal>
        <div className="section-label">Opportunity &amp; Economics</div>
        <h2>One standard for the <span className="highlight">whole fleet</span></h2>

      <div className="opp-grid">
        <Reveal className="opp-card hero"><div className="ol">Fleet E7 at $13/user</div><div className="ov">$11.08M<span style={{fontSize:'15px',fontWeight:600}}> / yr</span></div><div className="os">71,000-user fleet. Covering just SOFIA&rsquo;s 30K on the full stack (~$18.36M) costs more.</div></Reveal>
        <Reveal className="opp-card"><div className="ol">Absorbed today</div><div className="ov">96.2%</div><div className="os">Of agent consumption rides owned licenses (Measured, MSC data)</div></Reveal>
        <Reveal className="opp-card"><div className="ol">Agents in tenant</div><div className="ov">~8,000</div><div className="os">~half Copilot Studio; governed by Agent 365 + FinOps</div></Reveal>

        <Reveal className="opp-card"><div className="ol">FY27 Forecast (booked)</div><div className="ov">{fmt(fyForecast)}</div><div className="os">{fmt(opportunity.billed)} billed co-term, {opportunity.bm}mo, anniversary Jul 1 (FY28)</div></Reveal>
        <Reveal className="opp-card"><div className="ol">3-yr TCO vs standalone</div><div className="ov">$43.5M</div><div className="os">E7 $33.2M fixed vs $76.7M standalone. 57% discount.</div></Reveal>
        <Reveal className="opp-card"><div className="ol">Confidence</div><div className="ov">{opportunity.conf}</div><div className="os">{opportunity.dealType} · close {opportunity.close}</div></Reveal>
        <Reveal className="opp-card"><div className="ol">Motion</div><div className="ov">E7 + Consumption</div><div className="os">Copilot baked into both. Fixed foundation + governed meter.</div></Reveal>
      </div>
    </section>

    <section className="section" id="strategy" style={{background:'linear-gradient(180deg,#fff,#eef4fa)'}}>
      <Reveal><div className="section-label">Strategy</div><h2>How We <span className="highlight">Win</span></h2></Reveal>
      <div className="strat-grid">
        <Reveal className="strat-card"><h4>Why they buy</h4><ul className="strat-list">{strategy.whyBuy.map((x,i)=><li key={i}>{x}</li>)}</ul></Reveal>
        <Reveal className="strat-card"><h4>Why now</h4><ul className="strat-list">{strategy.whyNow.map((x,i)=><li key={i}>{x}</li>)}</ul></Reveal>
        <Reveal className="strat-card full"><h4>Winning strategy</h4><p>{strategy.winning}</p></Reveal>
        <Reveal className="strat-card full"><h4>Executive talking points</h4>{strategy.talking.map((x,i)=><div className="talk-row" key={i}>&ldquo;{x}&rdquo;</div>)}</Reveal>
      </div>
    </section>

    <section className="section" id="stakeholders">
      <Reveal><div className="section-label">Stakeholder Map</div><h2>Who&rsquo;s in the <span className="highlight">Decision</span></h2>
      <p className="section-intro">Who decides, what they care about, and where they stand. Harvested from transcripts, email, and meetings.</p></Reveal>
      <div className="stakeholder-grid">
        {stakeholders.map((s,i)=>(<Reveal key={i}><div className={`stakeholder-card ${scls[s.status]||'sh-engaged'}`}>
          <div className="sh-top"><div className="sh-name">{s.name}</div><span className="sh-chip">{s.status==='exec'?'Decision maker':s.status.replace('-',' ')}</span></div>
          <div className="sh-role">{s.role}</div><p className="sh-cares">{s.cares}</p>{s.note&&<div className="sh-note">&#9656; {s.note}</div>}
        </div></Reveal>))}
      </div>
    </section>

    <div className="foot">Internal Microsoft strategy for MSC Cargo. Pipeline and seats from MSX; executive narrative maintained by the Strategy Portal refresh-twin from transcripts, email, Teams, and the strategy work built with Sean. Two motions: E7 and consumption, Copilot baked into both. Not for external distribution.</div>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
